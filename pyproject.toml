[project]
name = "portfolio-commerce-support-agent"
version = "0.1.0"
description = "A recoverable, approval-gated commerce support multi-agent built with LangGraph."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "langchain>=1.0",
  "langgraph>=1.0",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.15,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commerce_support"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["commerce_support"]

