name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      RUN_REAL_MODEL_EVAL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python -m evals.run --suite v1 --output artifacts/rag-eval-v1.json
      - run: uv run python -m evals.load_smoke --output artifacts/load-smoke.json
      - uses: actions/upload-artifact@v7
        with:
          name: rag-eval-v1
          path: |
            artifacts/rag-eval-v1.json
            artifacts/load-smoke.json
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uv sync --frozen
        working-directory: .
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck -- --strict
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
